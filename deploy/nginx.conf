# Répartition round-robin entre les instances de l'API.
# Résolution DYNAMIQUE par le DNS interne de Docker (127.0.0.11) : toutes les adresses des replicas du service « api »
# sont utilisées et réévaluées toutes les 10 s (ajout ou retrait de replicas sans redémarrer nginx).
# Une résolution statique ne suffit pas : la résolution système de l'image Alpine (musl) ne renvoie qu'une adresse.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api_instances {
    zone api_instances 64k;
    server api:8080 resolve;
}

server {
    listen 80;

    # HTTP/1.1 vers les instances : en HTTP/1.0 (défaut de nginx), Kestrel refuse un POST sans Content-Length (400).
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # La synchronisation manuelle est synchrone (quelques secondes).
    proxy_read_timeout 120s;

    # Commandes du panier : JAMAIS renvoyées à une autre instance (invariant n° 4 d'AGENTS.md). Par défaut, nginx rejoue
    # PUT et DELETE après une erreur ou un délai dépassé : une commande déjà validée par la première instance recevrait
    # alors un 409 ou un 404 trompeur. Le client reçoit l'erreur (502/504) et décide lui-même.
    location /api/cart {
        proxy_pass http://api_instances;
        proxy_next_upstream off;
    }

    # Lectures, santé et administration : comportement par défaut (seules les requêtes idempotentes sont rejouées ;
    # le POST de synchronisation ne l'est jamais).
    location / {
        proxy_pass http://api_instances;
    }
}
